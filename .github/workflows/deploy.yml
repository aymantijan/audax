name: Deploy to Vercel (production)

# Replaces the missing Vercel↔GitHub webhook: every push to main builds and
# deploys straight to PRODUCTION (no manual "Promote to Production" step).
#
# One-time setup: add a repository secret VERCEL_TOKEN
#   GitHub → repo → Settings → Secrets and variables → Actions → New secret
#   Value: a token from https://vercel.com/account/tokens
# The org/project IDs below are NOT secret (they already live in
# .vercel/project.json in this repo), so they are inlined for zero extra setup.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_iLUPQlAZuhxvmAPcmkihnZEb
      VERCEL_PROJECT_ID: prj_vXcCnFY3gKzx79RaF5IlEMPIYPPQ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Clean stale link (use env IDs instead of committed .vercel)
        run: rm -rf .vercel

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
