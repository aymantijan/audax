name: Deploy to Vercel (production)

# Replaces the missing Vercel↔GitHub webhook: every push to main deploys to
# PRODUCTION (no manual "Promote to Production" step).
#
# Uses a REMOTE build (`vercel deploy --prod`, not build/--prebuilt): Vercel
# builds on its servers with the project's own Environment Variables — the same
# path the working native deploys used. A local `vercel build` instead relied on
# `vercel pull` re-materialising env into a file, which malformed
# VITE_SUPABASE_URL and broke the app. Remote build avoids that entirely.
#
# One-time setup: repo secret VERCEL_TOKEN (scoped to the vaudax team) at
#   Settings → Secrets and variables → Actions.
# Org/project IDs are NOT secret (already in .vercel/project.json) — inlined.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_iLUPQlAZuhxvmAPcmkihnZEb
      VERCEL_PROJECT_ID: prj_vXcCnFY3gKzx79RaF5IlEMPIYPPQ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production (remote build with project env)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
